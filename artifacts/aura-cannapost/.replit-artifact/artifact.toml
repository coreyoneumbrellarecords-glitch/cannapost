kind = "web"
previewPath = "/"
title = "Aura by CannaPost"
version = "1.0.0"
id = "artifacts/aura-cannapost"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25150

[services.development]
run = "pnpm --filter @workspace/aura-cannapost run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/aura-cannapost", "run", "build" ]
serve = "static"
publicDir = "artifacts/aura-cannapost/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25150"
BASE_PATH = "/"
